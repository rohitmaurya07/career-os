<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0812"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>
    <linearGradient id="maskPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="maskGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Full edge-to-edge background for maskable icon safe zone -->
  <rect width="512" height="512" fill="url(#maskGrad)"/>

  <!-- Centered safe-zone motif (within 80% circle) -->
  <g transform="translate(256, 256) scale(0.9)">
    <path d="M 0 -115 L 115 0 L 0 115 L -115 0 Z" fill="#0A0D15" stroke="url(#maskPrimary)" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Code Brackets -->
    <path d="M -45 -48 L -82 0 L -45 48" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 45 -48 L 82 0 L 45 48" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Spark -->
    <path d="M 0 -48 Q 12 -12 40 0 Q 12 12 0 48 Q -12 12 -40 0 Q -12 -12 0 -48 Z" fill="url(#maskGold)"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>
</svg>
