<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A0812"/>
      <stop offset="50%" stop-color="#12151E"/>
      <stop offset="100%" stop-color="#090B10"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#5A0E24" stroke-width="3"/>

  <!-- Subtle grid lines -->
  <circle cx="96" cy="96" r="64" fill="none" stroke="#F43F5E" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="96" cy="96" r="46" fill="none" stroke="#F43F5E" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Core Forge Shield / Diamond Icon -->
  <g transform="translate(96, 96)">
    <!-- Glowing background accent -->
    <path d="M 0 -48 L 48 0 L 0 48 L -48 0 Z" fill="#E11D48" fill-opacity="0.15" filter="url(#glow)"/>
    
    <!-- Outer Diamond -->
    <path d="M 0 -42 L 42 0 L 0 42 L -42 0 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Code Brackets & Anvil Sparks Symbol -->
    <!-- Left Bracket < -->
    <path d="M -16 -18 L -30 0 L -16 18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 16 -18 L 30 0 L 16 18" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Forge Fire / Star -->
    <path d="M 0 -18 Q 4 -4 14 0 Q 4 4 0 18 Q -4 4 -14 0 Q -4 -4 0 -18 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- FAANG Star Badge on Corner -->
  <circle cx="144" cy="48" r="14" fill="#181D29" stroke="#E11D48" stroke-width="2"/>
  <path d="M 144 40 L 146.5 45.5 L 152 46.2 L 148 50 L 149 55.5 L 144 52.8 L 139 55.5 L 140 50 L 136 46.2 L 141.5 45.5 Z" fill="url(#goldGrad)"/>
</svg>
